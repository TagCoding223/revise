name: Spring Boot CI

on:
  push:
    branches: [ "main", "master" ]
    # ONLY trigger if files inside the backend folder are modified
    paths:
      - 'backend/**' 
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # CRITICAL: Tells the runner to execute all 'run' commands inside this folder
    defaults:
      run:
        working-directory: ./backend 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: 'maven'

    - name: Grant execute permission for mvnw
      run: chmod +x mvnw

    - name: Run Tests
      run: ./mvnw clean test