name: Spring Boot CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**' 
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Grant execute permission for mvnw
      run: chmod +x mvnw

    # Run ONLY the specific lightweight test class using -Dtest
    - name: Run Specific Tests (No DB Required)
      run: ./mvnw clean test -Dtest="TimezoneConfigTest"