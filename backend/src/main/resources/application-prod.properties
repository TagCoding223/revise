# ===================================================================
# 1. DATABASE CONFIGURATION (MySQL)
# ===================================================================
spring.datasource.url=${PROD_DB_URL:jdbc:mysql://localhost:3306/revise_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# ===================================================================
# 2. JPA / HIBERNATE CONFIGURATION
# ===================================================================
# For local dev, 'update' is fine. In production, override this with 'validate' or 'none'.
spring.jpa.hibernate.ddl-auto=${PROD_DB_DDL_AUTO:validate}

# ===================================================================
# 3. CUSTOM JWT CONFIGURATION (Auth)
# ===================================================================
# Default fallback key provided for local dev only. Override in prod!
app.jwt.secret=${PROD_JWT_SECRET:your_super_secret_local_dev_key_make_it_very_long_12345!}
# JWT Expiration time in milliseconds (default: 86400000 ms = 24 hours)
app.jwt.expiration-ms=${PROD_JWT_EXPIRATION_MS:86400000}

# ===================================================================
# 4. GOOGLE OAUTH2 CONFIGURATION
# ===================================================================
spring.security.oauth2.client.registration.google.client-id=${PROD_GOOGLE_CLIENT_ID:default-client-id.apps.googleusercontent.com}

# ===================================================================
# 5. RESEND EMAIL API CONFIGURATION
# ===================================================================
resend.api.key=${PROD_RESEND_API_KEY:re_default_local_key}
resend.from.email=${PROD_RESEND_FROM_EMAIL:noreply@yourdomain.com}

# ===================================================================
# 6. Profile and Default Spring Security Password Override
# ===================================================================
spring.security.user.name=${PROD_ADMIN_USERNAME:vishal}
spring.security.user.password=${PROD_ADMIN_USER_PASSWORD:2005}
