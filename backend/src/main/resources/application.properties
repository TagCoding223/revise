# Import the .env file
spring.config.import=optional:file:.env[.properties]

# ===================================================================
# 1. SERVER CONFIGURATION
# ===================================================================
# The port your Spring Boot application will run on
server.port=${PORT:8080}
# Optional: Set an application name
spring.application.name=${APP_NAME:revise-backend}

# ===================================================================
# 2. JPA / HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# 3. ACTUATOR CONFIGURATIONS
# ===================================================================
# Change base path from /actuator to /management
management.endpoints.web.base-path=/management

# Run management endpoints on a distinct port (e.g., 9000)
management.server.port=9000

# By default, /actuator/health only returns a simple {"status": "UP"}.
management.endpoint.health.show-details=always

# Expose specific endpoints only
management.endpoints.web.exposure.include=health,info,metrics,env,loggers,beans,threaddump

# Expose ALL endpoints (use carefully in production)
# management.endpoints.web.exposure.include=*

# ===================================================================
# 4. Profile and Default Spring Security Password Override
# ===================================================================
spring.profiles.active=${ACTIVE_PROFILE:dev}

# ===================================================================
# 5. Frontend Info
# ===================================================================
frontend.base.url=${FRONTEND_BASE_URL:http://localhost:5173}