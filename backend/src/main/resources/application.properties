# ===================================================================
# 1. SERVER CONFIGURATION
# ===================================================================
# The port your Spring Boot application will run on
server.port=${PORT:8080}
# Optional: Set an application name
spring.application.name=${APP_NAME:revise-backend}

# ===================================================================
# 2. DATABASE CONFIGURATION (MySQL)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/revise_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# 3. JPA / HIBERNATE CONFIGURATION
# ===================================================================
# For local dev, 'update' is fine. In production, override this with 'validate' or 'none'.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect

# ===================================================================
# 4. CUSTOM JWT CONFIGURATION (Auth)
# ===================================================================
# Default fallback key provided for local dev only. Override in prod!
app.jwt.secret=${JWT_SECRET:your_super_secret_local_dev_key_make_it_very_long_12345!}
# JWT Expiration time in milliseconds (default: 86400000 ms = 24 hours)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# 5. GOOGLE OAUTH2 CONFIGURATION
# ===================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:default-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:default-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===================================================================
# 6. RESEND EMAIL API CONFIGURATION
# ===================================================================
resend.api.key=${RESEND_API_KEY:re_default_local_key}
resend.from.email=${RESEND_FROM_EMAIL:noreply@yourdomain.com}