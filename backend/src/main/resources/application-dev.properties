# ===================================================================
# 1. DATABASE CONFIGURATION (MySQL)
# ===================================================================
spring.datasource.url=${DEV_DB_URL:jdbc:mysql://localhost:3306/revise_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DEV_DB_USERNAME:root}
spring.datasource.password=${DEV_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# 2. JPA / HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.hibernate.ddl-auto=${DEV_DB_DDL_AUTO:update}
spring.jpa.show-sql=${DEV_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# 3. CUSTOM JWT CONFIGURATION (Auth)
# ===================================================================
# Default fallback key provided for local dev only. Override in prod!
app.jwt.secret=${DEV_JWT_SECRET:your_super_secret_local_dev_key_make_it_very_long_12345!}
# JWT Expiration time in milliseconds (default: 86400000 ms = 24 hours)
app.jwt.expiration-ms=${DEV_JWT_EXPIRATION_MS:86400000}

# ===================================================================
# 4. GOOGLE OAUTH2 CONFIGURATION
# ===================================================================
spring.security.oauth2.client.registration.google.client-id=${DEV_GOOGLE_CLIENT_ID:default-client-id.apps.googleusercontent.com}

# ===================================================================
# 5. RESEND EMAIL API CONFIGURATION
# ===================================================================
resend.api.key=${DEV_RESEND_API_KEY:re_default_local_key}
resend.from.email=${DEV_RESEND_FROM_EMAIL:noreply@yourdomain.com}

# ===================================================================
# 6. Profile and Default Spring Security Password Override
# ===================================================================
spring.security.user.name=${DEV_ADMIN_USERNAME:vishal}
spring.security.user.password=${DEV_ADMIN_USER_PASSWORD:2005}
