name: Spring Boot CI

# Trigger the pipeline on pushes or pull requests to the main branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download your code into the runner
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Set up the Java environment
    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: 'maven' # Caches dependencies to speed up future runs

    # Step 3: Grant execute permission for Maven Wrapper (if used)
    - name: Grant execute permission for mvnw
      run: chmod +x mvnw
      # If you aren't using the wrapper (mvnw), you can delete this step.

    # Step 4: Run the JUnit Tests
    - name: Run Tests
      run: ./mvnw clean test
      # If you don't have the mvnw file, change this to: run: mvn clean test